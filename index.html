

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хабза Пром Доставка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0204;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #990011;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(153,0,17,0.5);
            margin-bottom: 5px;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #140508;
            border: 1px solid #3a0006;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #cc0018;
            font-weight: 600;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            background-color: #1f0a0d;
            border: 1px solid #4a0d14;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        input:focus, textarea:focus {
            border-color: #990011;
            outline: none;
            box-shadow: 0 0 8px rgba(153,0,17,0.4);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .btn {
            width: 100%;
            background-color: #990011;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(153,0,17,0.3);
        }
        .btn:hover {
            background-color: #b30016;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h1>ХАБЗА-ПРОМ</h1>
    <div class="subtitle">CRIMSON PREMIUM DELIVERY SYSTEM</div>

    <div class="container">
        <div class="input-group">
            <label for="runner-id-input">🆔 КОД (ID) БЕГУНА:</label>
            <input type="number" id="runner-id-input" placeholder="Введи Telegram ID бегуна..." required>
        </div>

        <div class="input-group">
            <label for="order-details">📦 ЧТО КУПИТЬ И ПРИНЕСТИ:</label>
            <textarea id="order-details" placeholder="Например: Шаурма сырная 1шт, Кола 0.5л. Корпус 3, каф. 204" required></textarea>
        </div>

        <button class="btn" id="send-order-btn">Оформить заказ 🚀</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на весь экран телефона

        document.getElementById("send-order-btn").addEventListener("click", () => {
            const runnerId = document.getElementById("runner-id-input").value.trim();
            const orderDetails = document.getElementById("order-details").value.trim();

            if (!runnerId) {
                alert("Пожалуйста, укажи Telegram ID бегуна!");
                return;
            }
            if (!orderDetails) {
                alert("Напиши, что именно нужно принести!");
                return;
            }

            // Формируем текст, который получит бегун в личку
            const formattedText = `📦 *Новый заказ!* \n\n📋 *Детали:* ${orderDetails}\n\n👤 *Заказчик:* ${tg.initDataUnsafe.user?.first_name || 'Покупатель'}`;

            // Собираем объект для отправки боту
            const dataToSend = {
                action: "new_order",
                text: formattedText,
                runner_id: runnerId
            };

            // Отправляем данные боту и закрываем приложение
            tg.sendData(JSON.stringify(dataToSend));
        });
    </script>
</body>
</html>
